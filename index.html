spray|to send out a liquid in tiny drops|Dad will spray the garden with the hose.

market|a place where people buy and sell things|We bought peaches at the farmers market.

wrong|not right or correct|I got one answer wrong on the quiz.

flock|a group of birds or sheep|A flock of geese flew south.
sparkle|to shine with little flashes of light|The snow seemed to sparkle in the sun.

steps|a set of stairs; or the movements your feet make when walking|She sat on the front steps.

fire|the heat, light, and flames from something burning|We roasted marshmallows over the fire.

truth|what is real and true; not a lie|Always tell the truth.
tallest|higher than all the others|Giraffes are the tallest animals.
